name: Build dan Push SGLang MiniMax H3 Worker

# 100% jalan di runner GitHub Actions — LAPTOP LOKAL BEBAS BUILD.
on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "handler.py"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-sglang:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-sglang:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
